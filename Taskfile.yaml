version: "3"

# CV_RELEASE_TAG and the two CV_RELEASE_SHA256_* digests, the pinned cv release
# content:build reads and verifies.
dotenv: [cv-release.env]

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  # Both targets typecheck cmd/website, whose go:embed patterns fail on an
  # empty dist/ or prerendered/, so the frontend has to exist before either
  # one runs.
  lint:vet:
    desc: Go vet
    deps: [web:build, prerender]
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    deps: [web:build, prerender]
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:docker:
    desc: Dockerfile lint
    cmds:
      - hadolint Dockerfile

  lint:shell:
    desc: Shell lint and format check over scripts/
    cmds:
      - shellcheck scripts/*.sh
      - shfmt --diff --indent 2 --case-indent scripts/*.sh

  lint:helm:
    desc: Helm chart lint
    vars:
      INGRESS_SET1: config.trustedProxyCidrs=10.0.0.0/8,ingress.enabled=true,ingress.className=nginx
      INGRESS_SET2: ingress.hosts[0].host=ostendorf.dev
      INGRESS_SET3: ingress.hosts[0].paths[0].path=/,ingress.hosts[0].paths[0].pathType=Prefix
      HTTPROUTE_SET1: httpRoute.enabled=true,httpRoute.hostnames[0]=ostendorf.dev
      HTTPROUTE_SET2: httpRoute.parentRefs.name=shared-gateway,httpRoute.parentRefs.namespace=gateway-system
    cmds:
      - helm lint charts/ostendorf.dev
      - >-
        helm lint charts/ostendorf.dev
        --set {{.INGRESS_SET1}},{{.INGRESS_SET2}},{{.INGRESS_SET3}}
      - >-
        helm lint charts/ostendorf.dev
        --set {{.HTTPROUTE_SET1}},{{.HTTPROUTE_SET2}}

  # kubeconform's default schema location carries no Gateway API schemas. A second
  # -schema-location, after the default one, adds the community CRDs-catalog
  # (https://github.com/datreeio/CRDs-catalog): kubeconform tries each location in
  # order and falls through to the next on a miss, so every other, non-CRD kind still
  # resolves against the default location first.
  validate:kubeconform:
    desc: Schema validation of the rendered Helm chart
    vars:
      INGRESS_SET1: config.trustedProxyCidrs=10.0.0.0/8,ingress.enabled=true,ingress.className=nginx
      INGRESS_SET2: ingress.hosts[0].host=ostendorf.dev
      INGRESS_SET3: ingress.hosts[0].paths[0].path=/,ingress.hosts[0].paths[0].pathType=Prefix
      HTTPROUTE_SET1: httpRoute.enabled=true,httpRoute.hostnames[0]=ostendorf.dev
      HTTPROUTE_SET2: httpRoute.parentRefs.name=shared-gateway,httpRoute.parentRefs.namespace=gateway-system
      GATEWAY_API_SCHEMA_1: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}'
      GATEWAY_API_SCHEMA_2: '/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json'
    cmds:
      - >-
        helm template charts/ostendorf.dev
        | kubeconform -strict -summary -schema-location default
        -schema-location '{{.GATEWAY_API_SCHEMA_1}}{{.GATEWAY_API_SCHEMA_2}}'
      - >-
        helm template charts/ostendorf.dev
        --set {{.INGRESS_SET1}},{{.INGRESS_SET2}},{{.INGRESS_SET3}}
        | kubeconform -strict -summary -schema-location default
        -schema-location '{{.GATEWAY_API_SCHEMA_1}}{{.GATEWAY_API_SCHEMA_2}}'
      - >-
        helm template charts/ostendorf.dev
        --set {{.HTTPROUTE_SET1}},{{.HTTPROUTE_SET2}}
        | kubeconform -strict -summary -schema-location default
        -schema-location '{{.GATEWAY_API_SCHEMA_1}}{{.GATEWAY_API_SCHEMA_2}}'

  # helm-unittest is a Helm plugin, and helm only finds a plugin inside HELM_PLUGINS.
  # The mise entry's postinstall copies it into helm's own plugin directory, but that
  # hook runs only on a fresh install: a cached tool skips it. This builds a plugin
  # directory holding exactly one entry, pointing at whatever mise resolved, so the
  # target no longer depends on the hook having run.
  helm:plugins:
    desc: Link helm-unittest into a plugin directory helm can read
    internal: true
    run: once
    cmds:
      - rm -rf .task/helm-plugins
      - mkdir -p .task/helm-plugins
      - ln -s "$(mise where 'github:helm-unittest/helm-unittest')" .task/helm-plugins/unittest

  test:helm:
    desc: Helm chart unit tests
    deps: [helm:plugins]
    env:
      HELM_PLUGINS: .task/helm-plugins
    cmds:
      - helm unittest charts/ostendorf.dev

  # Build time only: the one place the cv release and the GitHub API are
  # reached. GITHUB_TOKEN is read from the environment when set (CI sets it from
  # secrets.GITHUB_TOKEN, read only) and is optional, since public data needs no
  # scope. It is skipped while cv-release.env and the output are unchanged, so
  # task build in CI, after a separate content step, does not call GitHub twice.
  # Refresh the GitHub data of an unchanged pin with: task content:build --force
  content:build:
    desc: Fetch the pinned cv release and the GitHub data, write the dataset the binary embeds
    sources:
      - cv-release.env
      - go.mod
      - cmd/content/*.go
      - internal/content/*.go
    generates:
      - internal/content/generated/dataset.json
    cmds:
      - go run ./cmd/content

  build:
    desc: Compile the website binary
    deps: [web:build, prerender, content:build]
    cmds:
      - go build -o bin/website ./cmd/website

  # The content tests read their own checked in sample, so this target does not
  # need content:build: internal/content/generated holds a .gitkeep, which is
  # enough for go:embed.
  test:go:
    desc: Go test
    deps: [web:build, prerender]
    cmds:
      - go test -race -count=1 ./...

  check:govue-version:
    desc: Verify go.mod and web/package.json pin the same govue version, and that the lockfile pins its subdirectory
    cmds:
      - go test -race -count=1 ./internal/depsync/...

  test:routes:
    desc: Route table conformance, the prerendered output against internal/routes' embedded table
    deps: [web:build, prerender]
    cmds:
      - go test -race -count=1 -run TestPrerenderedOutputMatchesRouteTable ./cmd/website/...

  web:deps:
    desc: Install the web/ dependencies
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package, including the theme contrast check
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  web:build:
    desc: Build the SPA bundle into cmd/website/dist
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run build

  web:fmt:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format

  prerender:
    desc: Render every route to static HTML into cmd/website/prerendered
    dir: web
    deps: [web:build]
    cmds:
      - pnpm run prerender

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: lint:docker
      - task: lint:shell
      - task: lint:helm
      - task: validate:kubeconform
      - task: test:helm
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build
      - task: prerender
      - task: build
      - task: test:go
      - task: check:govue-version
      - task: test:routes

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
