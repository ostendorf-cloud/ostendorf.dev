services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      LOG_LEVEL: "debug"
      # Page view counting is off unless both are set in .env or the shell.
      # Empty values count as unset.
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
